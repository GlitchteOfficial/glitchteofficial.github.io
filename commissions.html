<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitchte's Portfolio | Commissions</title>
    <style>
        :root {
            --bg-base: #0a0512;
            --text-primary: #ffffff;        
            --text-body: #f4f0ff;           
            --accent-cyan: #00ffff;
            --accent-pink: #ff0055;
            --accent-purple: #c060ff;       
            --font-mono: 'Courier New', Courier, monospace;
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --transition-smooth: all 0.3s ease;
        }

        /* Reset & Base */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            color: var(--text-body);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            background-color: var(--bg-base);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Background Opening Animation Layer */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(5, 2, 10, 0.8), rgba(10, 4, 18, 0.85)),
                url('background.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            animation: bgOpenAnimation 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes bgOpenAnimation {
            0% { opacity: 0; transform: scale(1.08); }
            100% { opacity: 1; transform: scale(1); }
        }
