<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitchte's Portfolio | Contact</title>
    <style>
        :root {
            --bg-base: #0a0512;
            --text-primary: #ffffff;        
            --text-body: #f4f0ff;           
            --accent-cyan: #00ffff;
            --accent-pink: #ff0055;
            --accent-purple: #c060ff;       
            --font-mono: 'Courier New', Courier, monospace;
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --transition-smooth: all 0.3s ease;
        }

        /* Reset & Base */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            color: var(--text-body);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            background-color: var(--bg-base);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- BACKGROUND IMAGE LAYER --- */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            
            background-image: 
                linear-gradient(rgba(5, 2, 10, 0.85), rgba(10, 4, 18, 0.9)),
                url('background.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            z-index: -1;
            animation: bgOpenAnimation 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes bgOpenAnimation {
            0% {
                opacity: 0;
                transform: scale(1.08);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Typography */
        h1, h2, h3, nav a, .btn-main, .mono-text {
            font-family: var(--font-mono);
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Navigation */
        nav {
            background-color: rgba(6, 2, 12, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(157, 0, 255, 0.25);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            animation: fadeIn 1s ease forwards;
        }

        nav a {
            color: var(--text-body);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: var(--transition-smooth);
            position: relative;
        }

        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--accent-pink);
            transition: var(--transition-smooth);
        }

        nav a:hover, nav a.active {
            color: var(--accent-cyan);
        }

        nav a:hover::after, nav a.active::after {
            width: 100%;
            background-color: var(--accent-cyan);
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
        }

        /* Container & Refined Card */
        .container {
            max-width: 580px;
            margin: auto;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: fadeUp 0.8s ease 0.3s forwards;
            width: 100%;
        }

        .contact-card {
            background: rgba(13, 6, 26, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(192, 96, 255, 0.3);
            border-top: 2px solid var(--accent-purple);
            padding: 50px 40px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(192, 96, 255, 0.05);
            width: 100%;
            text-align: center;
            transition: var(--transition-smooth);
        }

        .contact-card:hover {
            border-color: rgba(0, 255, 255, 0.4);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 255, 255, 0.15);
        }

        h2 {
            font-size: 1.1rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 1.2rem;
            font-weight: 500;
        }

        .contact-card p {
            color: var(--text-body);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .discord-handle-box {
            background: rgba(8, 3, 16, 0.6);
            border: 1px dashed rgba(192, 96, 255, 0.4);
            padding: 18px;
            border-radius: 6px;
            margin: 20px 0;
            display: inline-block;
            width: 100%;
        }

        .tag {
            font-family: var(--font-mono);
            font-size: 1.8rem;
            color: var(--text-primary);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 1.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        .status-text {
            color: var(--accent-cyan);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 0;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: rgba(6, 2, 12, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 255, 255, 0.15);
            color: var(--text-body);
            font-size: 0.85rem;
            opacity: 0;
            animation: fadeIn 1s ease 0.6s forwards;
            width: 100%;
        }

        /* Responsive */
        @media (max-width: 650px) {
            .container {
                padding: 1rem;
            }
            .contact-card {
                padding: 35px 20px;
            }
        }
    </style>
</head>
