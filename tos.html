<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitchte's Portfolio | Terms of Service</title>
    <style>
        :root {
            --bg-base: #0a0512;
            --text-primary: #ffffff;        
            --text-body: #f4f0ff;           
            --accent-cyan: #00ffff;
            --accent-pink: #ff0055;
            --accent-purple: #c060ff;       
            --font-mono: 'Courier New', Courier, monospace;
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --transition-smooth: all 0.3s ease;
        }

        /* Reset & Base */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            color: var(--text-body);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            background-color: var(--bg-base);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Background Layer with Opening Animation */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(5, 2, 10, 0.85), rgba(10, 4, 18, 0.9)),
                url('background.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            animation: bgOpenAnimation 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes bgOpenAnimation {
            0% { opacity: 0; transform: scale(1.08); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Typography */
        h1, h2, h3, nav a, .btn-main, .mono-text {
            font-family: var(--font-mono);
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Navigation */
        nav {
            background-color: rgba(6, 2, 12, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(157, 0, 255, 0.25);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            animation: fadeIn 1s ease forwards;
        }

        nav a {
            color: var(--text-body);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: var(--transition-smooth);
            position: relative;
        }

            position: absolute;
